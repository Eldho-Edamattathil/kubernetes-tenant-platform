apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: local-selfsigned
  namespace: platform-gateway
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-local-ca
  namespace: platform-gateway
spec:
  isCA: true
  commonName: Platform Lab Local CA
  secretName: platform-local-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: local-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: platform-local-ca
  namespace: platform-gateway
spec:
  ca:
    secretName: platform-local-ca
