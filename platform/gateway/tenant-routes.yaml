apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments
  namespace: payments-dev
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
      sectionName: http
    - name: shared-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - payments.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: payments-web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reporting
  namespace: reporting-prod-demo
spec:
  parentRefs:
    - name: shared-gateway
      namespace: platform-gateway
      sectionName: http
    - name: shared-gateway
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - reporting.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reporting
          port: 8080
