apiVersion: v1
kind: Namespace
metadata:
  name: reporting-prod-demo
  labels:
    tenant: reporting
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting
  namespace: reporting-prod-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting
  template:
    metadata:
      labels:
        app: reporting
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reporting
          image: payments-web:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["node", "-e"]
          args:
            - |
              require("node:http").createServer((req, res) => {
                if (req.method !== "GET" ||
                    !["/", "/healthz"].includes(req.url)) {
                  res.writeHead(404);
                  return res.end();
                }
                res.writeHead(200, { "Content-Type": "application/json" });
                res.end(JSON.stringify({
                  service: "reporting",
                  status: "ok"
                }));
              }).listen(8080, "0.0.0.0");
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: reporting
  namespace: reporting-prod-demo
spec:
  selector:
    app: reporting
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reporting-default-deny
  namespace: reporting-prod-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reporting-allow-dns
  namespace: reporting-prod-demo
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
